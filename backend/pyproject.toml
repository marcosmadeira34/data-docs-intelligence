[project]
name = "ddi-backend"
version = "0.1.0"
description = "Data Docs Intelligence — ingestão, validação e comparação de planilhas para BPOs e escritórios contábeis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
ai = ["anthropic>=0.70"]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:openpyxl.*", "ignore:Using `httpx`"]
